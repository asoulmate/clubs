<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 반응형 + iOS 입력창 확대로 인한 레이아웃 깨짐 방지 (본문 16px 유지로 자동 확대 자체를 예방) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#166534" />
    <meta name="description" content="테니스 복식 경기 편성과 결과를 관리하는 클럽 앱" />
    <!-- PWA: 홈 화면 추가 시 주소창 없는 독립 앱(standalone)으로 실행 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS 는 manifest 의 display 를 무시하므로 별도 메타로 standalone 을 지정한다 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="테니스클럽" />
    <!-- 가독성 높은 Pretendard 웹폰트 (한글 최적화, 가변 굵기) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>창원테니스클럽</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
